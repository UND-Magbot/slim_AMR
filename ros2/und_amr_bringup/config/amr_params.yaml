# UND_AMR 차체 파라미터
#
# ⚠ TODO 표시된 값은 아직 실측 전이라 임시값입니다.
#   오도메트리 정확도가 전부 여기에 달려 있으니 반드시 실측해서 채우세요.

base_node:
  ros__parameters:

    # ---- 시리얼 (STM32 콘솔) ----
    serial_port: "/dev/ttyUSB0"      # USART1. USB CDC 쓰려면 /dev/ttyACM0
    baudrate: 115200
    # 지령 줄 확인값 (" #합"). 펌웨어가 맞지 않는 줄을 버린다.
    # 2026-09-28 펌웨어(DFU 로 구움)부터 지원. 옛 펌웨어로 되돌리면 false 로.
    line_checksum: true
    # 2026-09-30 펌웨어부터: CRC-16 확인값, 두 바퀴 한 줄 지령(w). 옛 펌웨어면 끌 것.
    line_crc: true
    pair_cmd: true
    # 소수 rpm 지령 ('v' 명령, 드라이브 0x60FF). 정수 rpm 디더링 대신 0.01 rpm.
    # 2026-09-28 16:31 펌웨어를 구운 뒤 true 로. 옛 펌웨어는 'v' 를 모른다.
    fine_rpm: true

    # ---- 차체 기구 ----
    # 실측 완료 (2026-08-25, 조립 후) — 서로 독립인 두 방법이 일치
    #
    #  (1) 원호 주행 (채택 근거)
    #      두 바퀴를 같은 방향 다른 속도로 굴려 완만한 곡선을 그리고,
    #      회전량을 라이다 스캔정합(ICP)으로 측정.  sep = (d_r - d_l) / theta
    #      좌/우 각 방향으로 재서 좌우 바퀴 직경차의 영향을 분리했다.
    #        우회전 3회 평균 0.1936 / 좌회전 2회 평균 0.2084
    #        연립하여 풀면  b = 0.1999,  좌륜이 우륜보다 직경 0.46% 큼
    #
    #  (2) 제자리 회전 30도 x 12구간 ICP → 0.1995 (산포 0.37%)
    #
    #  (3) 줄자 기하학적 바퀴 중심간 거리 190mm
    #      유효 윤거가 이보다 5% 큰 것은 정상 (타이어 접지폭 스크럽)
    #
    #  ⚠ 기존 가정값 0.40 은 실제의 2배였다. 그대로 두면 각속도 지령과
    #    오도메트리 회전량이 모두 2배로 어긋난다.
    #
    #  ⚠ 제자리 회전(t 지령)은 캐스터 4개를 억지로 비틀어 구동륜이 크게
    #    미끄러진다. 같은 지령을 두 번 줬을 때 실제 회전량이 998도 / 1183도
    #    로 18% 벌어졌다. 회전 캘리브레이션에 제자리 회전을 쓰면 안 된다.
    #
    #  (위 8/25 블록은 구 베이스 기록이다. 아래 9/10 실측이 현재 값이다)
    #  신형 SLIM 베이스. 줄자 실측 바퀴 중심간 175.0 mm.
    #  여기 값은 기하학적 윤거가 아니라 오도메트리용 '유효' 윤거다.
    #
    #  실측 2026-09-10 (tools/calib_sep.py, 손으로 360도 회전)
    #    시계   지도 -367.38 / 바퀴 -378.79 -> 0.1785
    #    반시계 지도 +372.84 / 바퀴 +386.16 -> 0.1793
    #    양방향 편차 0.45% 로 방향 편향 없음. 평균 0.1789 채택.
    #    스크럽 계수 1.0223 (구 베이스는 1.0521)
    #
    #  ⚠ 9/9 에 0.1731(계수 0.989)로 넣었던 것은 잘못이다. 그때 도구가
    #    (a) 자이로 바이어스를 로봇이 도는 중에 재고
    #    (b) 목표 미달 시 남은 시간을 헛돌아 위치추정 보정을 회전량에 섞었다.
    #    둘을 고치고 다시 재니 계수가 1 보다 크게(구 베이스와 같은 방향) 나왔다.
    #
    #  측정 방법 — 모터로 제자리회전을 시키면 캐스터가 비틀려 크게 미끄러진다
    #    (8/25: 같은 지령이 998도/1183도). 손으로 돌려야 한다.
    #    라이다 ICP(match_rotation)는 제자리회전 전용이라 손으로 돌릴 때
    #    위치가 같이 옮겨지면 깨진다(9/9 rms 0.0795). 그래서 지도 자세를 쓴다.
    #    회전 중 지도값은 정합이 뒤처지므로, 정지 상태의 시작/끝 자세만 쓰고
    #    누적값은 몇 바퀴 돌았는지 세는 데만 쓴다.
    wheel_separation: 0.1789

    # 실측 완료 (2026-08-25, 조립 후 · 캐스터 정렬주행 적용)
    #   측정법: 직진 주행 후 (a)줄자 실측 (b)라이다 스캔 ICP 정합, 둘을 교차검증
    #     4m 주행 7.4657 rev : 줄자 3.990 m → 170.1 mm / ICP 3.9802 m → 169.7 mm
    #     2m 왕복 8구간 ICP  : 0.5359~0.5380 m/rev (산포 0.07%) → 170.8~171.1 mm
    #   ICP 는 이동거리가 커질수록 스캔 겹침이 줄어 과소평가한다(4m 에서 -0.25%).
    #   줄자 직접실측과 산포 최소 구간의 중간값을 채택. 잔여 불확실성 ±0.3%.
    #
    #   ⚠ 캐스터 4개(앞2·뒤2) 구성이라, 정지 후 첫 출발에서 캐스터가
    #     새 방향으로 돌아설 때까지 옆으로 밀린다. 측정 전 같은 방향으로
    #     0.5m 굴려 캐스터를 정렬시키면 휨이 -2.47deg -> -0.81deg 로 줄었다.
    #  구 베이스 실측: 4m 주행 7.4657rev, 줄자 170.1mm / 라이다 ICP 169.7mm
    #  2026-09-09 베이스 교체, 09-11 왼쪽 바퀴 교체. 둘 다 동일 모델이라 유지.
    #
    #  주행으로 교차검증됨 (2026-09-11, 1.5m 직진 3회 전부 채택)
    #    오도메트리 대 라이다 정합: +3.3 / +1.7 / +1.2 mm (0.1% 수준)
    #      -> 평균 지름이 맞다는 뜻
    #    같은 시험의 직진 휨: +1.195 / -0.888 / +1.857 deg/2m (부호 불일정)
    #      -> 좌우 지름이 같다는 뜻. wheel_diameter_ratio 를 1.0 에서 건드리면
    #         없는 편향을 만들어 넣는 셈이다
    #  재측정 2026-09-16 (tools/verify_straight.py, 2m x 6회, 0.20/0.50 m/s)
    #    오도메트리 거리 오차가 6회 모두 같은 방향으로 +0.27 ~ +0.35 %
    #    (실제보다 더 갔다고 센다). 평균 +0.31 % 를 걷어낸다.
    #      0.1706 / 1.00313 = 0.17007  ->  0.1701
    #    휨(좌우 편향)은 같은 시험에서 부호가 갈려(평균 -0.07, 표준편차 1.10)
    #    보정하지 않는다. wheel_diameter_ratio 는 1.0 그대로다.
    wheel_diameter: 0.1701

    # 좌우 바퀴 유효직경 비 (좌 / 우). 위 wheel_diameter 는 두 바퀴의 평균이고
    # 실제 직경은  D_l = D * 2k/(1+k),  D_r = D * 2/(1+k)  로 나뉜다.
    #
    # 실측 2026-08-26 (앞쪽 웨이트 추가 후 재측정)
    #   보정 없이(k=1.0) 2m 직진했을 때의 휨을 라이다 스캔정합으로 측정하고
    #   theta = 2d/sep * (1-k)/(1+k)  로 역산했다.
    #     3회 유효: -0.523 / -0.577 / -0.999 deg/2m,  평균 -0.700
    #     -> k = 1.00091 / 1.00101 / 1.00174,  평균 1.00122
    #   좌륜이 우륜보다 0.122% 크다.
    #
    #   ⚠ 8/25 에 원호 주행 양방향으로 구한 1.00458 은 폐기했다.
    #     그 값이면 직진 휨이 -2.62 deg/2m 여야 하는데 실측은 -0.70 이라
    #     3.7배 과대였다. 원호법은 회전 중 슬립에 오염되기 쉬우므로,
    #     직진 휨을 잡는 목적에는 직진에서 직접 역산한 값을 쓴다.
    #
    #   ⚠ (구 베이스) 남은 지배적 오차는 이 0.12% 가 아니라 구동륜 간헐
    #     접지 불량이었다. 신형 베이스는 스프링 서스펜션으로 해결됐고,
    #     이후 나타난 '한쪽이 홱 서는' 증상은 접지가 아니라 시리얼에서
    #     지령이 깨진 것이었다(2026-09-11, base_node.verify_cmd 로 해결).
    #
    # 1.0 으로 두면 좌우를 구분하지 않던 예전 동작과 완전히 같다.
    #  ⚠ 2026-09-09 베이스 교체로 위 실측(1.00122)은 무효.
    #    그 바퀴에만 해당하는 값이라 새 베이스에 적용하면 오히려 휘게 만든다.
    #    보정 없음(1.0)으로 되돌렸다. veer_repeat.py 로 접지를 먼저 확인하고,
    #    verify_straight.py 로 휨을 재서 다시 역산할 것.
    wheel_diameter_ratio: 1.0

    # 드라이브 목표속도 오브젝트가 1 rpm 단위라, 위 0.46% 보정량은
    # 25rpm 에서 0.1rpm 이라 단순 반올림에서 사라진다.
    # 잔차를 다음 주기로 넘겨(오차확산) 시간 평균으로 맞춘다.
    #   적용 시 좌우 지면속도 차이 0.456% -> 0.004%
    # 지령이 0 일 때는 잔차와 무관하게 0 을 내보내므로 정지는 안전하다.
    rpm_dither: true

    # 실측 완료 (2026-08-21, tools/calib_wheel.py)
    #   60rpm 정속 30초 → counts/회전 = 4096.2 / 4096.3 (두 축 편차 0.002%)
    #   바퀴 실제 회전수 = 지령 rpm 과 일치 → 직결 확정
    gear_ratio: 1.0

    # 실측 완료: 엔코더 4096 counts / 바퀴 1회전 (직결이라 모터회전 = 바퀴회전)
    # 오도메트리는 rpm 대신 이 값으로 위치를 적분한다. rpm 피드백은
    # 1rpm 분해능 / 30ms 샘플링이라 저속에서 양자화 오차가 크다.

    counts_per_wheel_rev: 4096

    # 바퀴 배선 — 어느 드라이브 축이 어느 쪽이고, 양수 지령이 전진인가.
    # 베이스를 다시 만들거나 모터 커넥터를 손대면 바뀐다. 코드는 안 고쳐도 된다.
    #
    # 2026-09-10 (2차) 모터 커넥터 교체 후 tools/calib_wiring.py 로 재판정.
    #   전진 지령 -> 지도에서 뒤로,  좌회전 지령 -> 지도에서 왼쪽
    #   => 부호만 뒤집고 축 대응은 그대로 두면 되는 조합
    #
    # 판정 방법: 오도메트리는 이 설정을 그대로 따라 계산되므로 근거가 못 된다.
    #   slam_toolbox 의 map->base_link 를 정답으로 쓴다.
    #   부호를 뒤집으면 직진과 회전이 '함께' 뒤집히고,
    #   축을 바꾸면 회전만 뒤집히므로 두 시험으로 네 조합이 갈린다.
    #
    # (1차 설정이었던 좌=축2(-1)/우=축1(-1) 은 커넥터 교체 전 값이다)
    # ⚠ 2026-10-26 차체 변경으로 앞뒤가 반대가 됐다(사용자: "로봇 뒤가 앞임").
    #   로봇 좌표를 180도 돌린 것과 같다: 예전 오른쪽 바퀴(축2)가 새 왼쪽, 둘 다 부호 반대.
    #   예전: left_axis 1 / right_axis 2 / sign +1 +1
    left_axis: 2
    right_axis: 1
    left_sign: -1.0
    right_sign: -1.0

    # ---- 제한 ----
    max_wheel_rpm: 200               # 펌웨어 클램프는 400

    # 가속 제한. 지령이 확 바뀌어도 바퀴에는 완만하게 실린다.
    #
    # 없을 때는 0.2 m/s 출발이 0 -> 22 rpm 한 번에 뛰었고, 그 순간 두 바퀴가
    # 받는 부하 차이로 차체가 돌아갔다 — 직진 6회 모두 출발 직후 0.2m 지점에서
    # 좌우 바퀴 차이가 최대였다(2026-09-16).
    #
    # nav2 경로에는 velocity_smoother(0.4 m/s^2)가 있지만 수동 조종과 렉
    # 진입은 그것을 안 거친다. 여기서 걸어야 모든 경로가 덮인다.
    # 0 으로 두면 제한 없음.
    # 감속은 가속보다 세게 허용한다. 세우는 일이 늦으면 위험하다.
    # 0.9 m/s^2 면 0.2 m/s 에서 0.22초, 22mm 더 간다.
    #
    # 비상정지와 통신 끊김은 이 제한을 안 거친다 — 전자는 base_node 의
    # ~/stop_now 서비스로, 후자는 cmd_timeout 감시가 즉시 0 rpm 을 보낸다.
    #
    # ⚠ 2026-09-28 완만하게 낮춤 (가속 0.35->0.20, 1.20->0.60 / 감속 0.90->0.60,
    #   3.00->1.50). 속도가 빨리 바뀌면 캐스터가 방향을 틀며 차체를 돌린다
    #   (사용자 지적). 정지 거리: 0.25 m/s 에서 5cm, 0.6 m/s 에서 30cm.
    #   비상정지(~/stop_now)는 이 제한을 거치지 않는다. 도킹 회전(0.5 rad/s^2)과
    #   진입·나오기 직선 가속(약 0.03 m/s^2)은 이 값보다 낮아 영향 없다.
    max_accel_mps2: 0.20
    max_accel_rps2: 0.60
    max_decel_mps2: 0.60
    max_decel_rps2: 1.50

    # 전진하면서 도는 동안의 최소 회전 반경 [m].
    #
    # 회전 반경은 v/w 다. 가속하는 동안 v 가 아직 작은데 w 가 제 값으로
    # 나가면 반경이 확 줄어 제자리에서 홱 도는 것처럼 보인다 — 0.01 m/s 에
    # 0.05 rad/s 면 반경 0.2m 다. 그래서 출발할 때만 급회전이 생겼다.
    #
    # 제자리 회전(전진 지령 0)은 이 제한을 안 받는다.
    #
    # ⚠ 1.5 -> 0 (끔, 2026-09-29). nav2 RPP 는 반경 0.6m 곡선까지 따라가는데
    #   여기서 1.5m 로 잘라, 코너마다 계획 경로 바깥으로 크게 돌았다(0.25 m/s
    #   에서 회전 상한 9.5 도/s). 곡선에서 RPP 가 감속하면 허용 회전도 같이
    #   줄어 반경이 끝까지 1.5m 로 묶였다. 출발 때 캐스터 때문에 휘청이는
    #   것은 캐스터 교체로 따로 본다(사용자 결정). 도킹은 전부터 이 제한을
    #   건너뛰었다(/cmd_vel_noradius).
    # ⚠ 0 -> 0.5 (같은 날). 끄자 목표 바로 앞(0.08 m/s)에서 RPP 가 목표점이
    #   코앞이 되며 조향을 -10 -> +16 도/s 로 뒤집는 움찔이 드러났다(왕복 6회
    #   기록). 1.5 는 이것을 3 도/s 로 눌러 숨기고 있었다. 0.5 는 0.25 m/s
    #   에서 29 도/s 를 허용해 RPP 곡선(반경 0.6m)을 막지 않고, 0.08 m/s
    #   에서는 9 도/s 로 움찔을 절반 아래로 누른다. 제자리 회전은 제한 없음.
    min_turn_radius_m: 0.5

    # 주행 중 자이로 받아치기 이득 (base_node 설명 참고). 0 이면 끔.
    # ⚠ 0.6 -> 0 (같은 날). 도킹(0.03~0.16 m/s)에서는 줄었지만 nav2 주행에
    #   넣자 사용자가 바로 "더 심하게 S자" — 지연 0.7초짜리 자이로로 받아치는
    #   고리가 nav2 조향 고리와 겹쳐 흔들림을 키운 것으로 본다. 끔.
    rate_damping_kd: 0.0
    # /odom 회전속도 분산 [(rad/s)^2]. EKF 가 방향을 바퀴 위주로 잡게 낮춘다
    # (IMU 는 0.01). 2026-10-02, ekf.yaml odom0_config 설명 참고. 예전 값 0.10.
    odom_yaw_rate_var: 0.0004
    # 2026-11-13 0.6 -> 1.0 (사용자: "최고속도 더 올릴수있어?" / "문제없는 부분까지 올려").
    # 바퀴 200rpm = 1.78 m/s 라 모터 여유는 크다. 1.0 에서 정지거리 약 0.7m 를
    # collision_monitor FootprintApproach(2초 앞) 가 막는다. 카메라(앞 1.5m)도 들어간다.
    max_linear_mps: 1.0
    max_angular_rps: 1.5
    cmd_timeout_s: 0.5               # cmd_vel 이 끊기면 정지

    # ---- 주기 ----
    poll_hz: 20.0                    # STM32 에 'f' 를 보내 피드백 받는 주기
    publish_odom_tf: true            # EKF 를 쓰면 false 로 두고 ekf 가 발행

    # ---- 프레임 ----
    odom_frame: "odom"
    base_frame: "base_link"
