# 대차(렉) 규격 등록표
#
# 라이다로 다리 네 개를 찾아 '가로 x 세로' 로 어느 대차인지 판별한다.
# 다리 모양(원형/사각/기타)과 굵기는 보지 않는다 — 같은 대차의 네 다리도
# 캐스터가 향한 방향에 따라 32~82mm 로 제각각 측정된다(2026-08-26 실측).
#
# 새 대차가 생기면 아래에 줄만 추가하면 된다. 코드는 고칠 필요 없다.
#
#   width  : 좌우 다리 중심 간 거리 [m]
#   depth  : 앞뒤 다리 중심 간 거리 [m]
#   tol    : 허용 오차 [m]. 이 안에 들면 그 대차로 본다
#   standoff : 이만큼 떨어져 서서 알아본다 [m]. 안 적으면 1.8
#   cam_legs : 카메라로 확인할 다리 수. 0 이면 확인을 건너뛴다
#   clearance_width : 캐스터까지 포함한 실측 통과 폭 [m], 렉 검출 축을 중심으로
#     좌우 모두 비어 있는 폭(2 x 더 좁은 쪽 반폭). 캐스터가 회전하는 모든 자세와
#     로봇이 차지하는 높이를 포함한 최소값. 단순한 기둥 중심 간격이 아니다.
#     생략 시 기존 기둥 기준 계산. 명시한 0은 미측정으로 도킹 시작을 차단한다.
#     center_offset 이 있으면 그 중심을 기준으로 한 폭이다.
#   center_offset : 실제 통로 중심이 라이다 렉 축에서 떨어진 거리 [m].
#     + 는 도킹을 마친 로봇 기준 왼쪽. 생략하면 0
#   note   : 메모

cart_detector:
  ros__parameters:
    # 검출 범위와 다리 후보 조건
    max_range: 3.0          # 이 거리 안에서만 찾는다 [m]
    cluster_gap: 0.05       # 점 사이가 이만큼 벌어지면 다른 물체로 끊는다 [m]
    # 다리 후보로 볼 덩어리 폭의 하한 [m].
    # ⚠ 0.010 -> 0.003 (2026-09-29). 새 자리에서 ls_origin 왼쪽 다리 둘이 점
    #   2~5개, 폭 4~8mm 로만 잡혀(비스듬한 면·반사) 후보에서 빠졌고, 가끔
    #   10mm 를 넘는 순간에만 인식되어 깜빡였다. 점 2개 이상 조건(아래)은
    #   그대로라 점 하나짜리 잡음은 여전히 거른다.
    leg_width_min: 0.003
    leg_width_max: 0.100    # 상한. 캐스터가 크게 보일 때까지 감안
    leg_min_points: 2       # 이 점수 미만이면 무시
    # 다리보다 넓은 덩어리의 양 끝 이 길이도 다리 후보로 [m]. 0 이면 끔.
    # ⚠ ls_origin 뒤 다리 둘이 뒤 물체와 5cm 안으로 붙어 158/268mm 덩어리가
    #   되어 버려졌다. 1.53m 에서 후보 3개 -> 인식 0/30. 켜면 30/30,
    #   중심 오차 1mm(2026-09-28 같은 자리 스캔 30장).
    leg_end_seg: 0.04
    # 다리가 세로로 이어지는지 볼 때, 라이다 평면(지면 325mm)에서 아래로
    # 훑는 길이. 150mm 로 두었더니 캐스터 몸통(높이 ~200mm)에 못 닿고
    # 그 사이 얇은 기둥만 지나가는데, 기둥은 뎁스가 잘 안 잡혀 전부
    # 실패했다(2026-08-28). 바닥 가까이까지 내려가도록 늘린다.
    verify_col_height: 0.30
    min_score: 0.25         # 이 점수 미만이면 대차로 인정하지 않는다
    publish_hz: 5.0

    # 등록된 대차 종류 (이름을 carts 목록에 넣고 값을 아래에 적는다)
    carts: ["lg_custom", "und_1", "ls_origin"]
    lg_custom:
      width: 0.650
      depth: 0.574
      tol: 0.040
      standoff: 1.5
      note: "실측 2026-08-28"
    und_1:
      width: 0.722
      depth: 0.685
      tol: 0.040
      standoff: 1.5
      note: "실측 2026-08-28"
    ls_origin:
      # ⚠ 2026-09-21 처음 넣은 값이 틀렸다. width 에 0.709 를 넣었는데
      #   그것은 변이 아니라 '대각선' 이다. 다리 네 점 사이 거리 여섯 개를
      #   재어 보면 423 / 426 / 563 / 570 / 706 / 709 다 — 변은 423 과 566,
      #   706 은 대각선이고 sqrt(423^2+566^2)=706 으로 정확히 맞는다.
      #   (이 렉은 '비직각' 이 아니다. 그 결론도 이 오류에서 나왔다.)
      width: 0.423
      depth: 0.566
      # 2026-09-23 입구 캐스터 접촉 보고. 20mm 검출 보정 반지름으로
      # 물리 여유를 대신하지 않는다. 실측 전에는 숫자를 추정해서 넣지 말 것.
      #
      # 2026-09-23 실측: 캐스터 위에 두께 10mm 미만의 판이 있고, 봉 중심을
      # 기준으로 안팎 양쪽에 걸쳐 전체 65mm 다. 즉 통로 쪽으로 32.5mm —
      # 검출 보정 반지름 20mm 가 아니다. 판은 캐스터 높이(~200mm)에 있어
      # 라이다 평면(지면 325mm) 아래다. 검출기는 이걸 영영 못 본다.
      #   통과 폭 = 423 - 32.5 - 32.5 = 358mm, 한쪽 여유 = (358-270)/2 = 44mm
      # 기존 기둥 기준 56.5mm 는 한쪽당 12.5mm 를 과대평가한 값이었다.
      # 9/23 접촉 실행의 모서리는 남은 633mm 에서 49mm, 616mm 에서 50mm 로
      # 44mm 를 5~6mm 넘겼지만 56.5mm 기준으로는 통과했다. 그래서 닿았다.
      #
      # ⚠ 실측 없이 접촉 기록으로 잡은 값이다(2026-09-28, 실측 안 하기로 함).
      #   오늘 접촉 두 번이 모두 로봇 오른쪽이었고 계산상 31~33mm 지점 —
      #   13:32 진입(입구 모서리 32mm), 14:25 빠져나오기(다리 자리 외곽
      #   32mm). 오른쪽 실제 여유는 30mm 로 본다. 왼쪽은 30mm 넘게 치우친
      #   적이 여러 번인데 닿은 적이 없어 44mm(판 65mm 기준) 를 유지한다.
      #   통로 중심 = 라이다 축에서 왼쪽 (44-30)/2 = 7mm, 반폭 여유 37mm.
      #   clearance_width = 2 x (135 + 37) = 344mm
      #   원인(판 폭이 캐스터마다 다름 / 로봇 오른쪽 돌출 / 렉 비대칭)은
      #   모른다. 왼쪽에서 닿으면 center_offset 을 줄일 것.
      # 2026-11-13 0.358/0.0 으로 바꿨다가 되돌림: 위 344/7mm 는 로봇 폭이 아니라 '렉 쪽(라이다 렉 축과
      #   실제 통로의 차이, 오른쪽이 좁음)' 기록이라 차체가 바뀌어도 유효하다. 358/0 으로 정렬 +3mm 진입에서
      #   다시 오른쪽(라이다 쪽, 날개 밖으로는 안 나옴 — 사용자)이 렉 안쪽에서 걸렸다. 새 차체(328.8)로는
      #   중심 7mm 왼쪽 기준 한쪽 여유 7.6mm.
      clearance_width: 0.344
      center_offset: 0.007
      # 위를 바로잡아 허용오차도 되돌린다. 60mm 로 넓혔던 것은 틀린 값을
      # 억지로 맞추느라 그런 것이다.
      tol: 0.040
      # ⚠ 카메라 확인 생략(0). 크롬 와이어 선반이라 기둥에서 깊이가 거의
      #   안 잡힌다. 1.5m 까지 다가가도 다리 4개 중 2개만 확인된다
      #   (하나는 가려지고 하나는 적중비 0.25). 유령 대차 방어는
      #   'POI 자리 45cm 안' 조건이 대신한다(2026-09-21).
      cam_legs: 2           # 2026-11-13 0 -> 2: 넥 위 정면 카메라가 앞 기둥 2개를 확인 (뒤 기둥은 선반에 가림)
      # ⚠ '1.73m 에서 끊긴다' 던 예전 측정은 틀렸다. 그때는 규격에 대각선
      #   709mm 를 변으로 넣어 둬 검출기가 억지로 맞추고 있었다. 바로잡은
      #   뒤 로그 1508 표본에서 2.5~3.0m 구간 350회, 최원거리 2.71m 다.
      #
      # ⚠ 그렇다고 멀리 둘 수도 없다. 1.7m 에서는 실제로 인식이 안 됐다
      #   (2026-09-21). 로그의 '2.7m 인식' 은 프레임 수를 인식률로
      #   잘못 읽은 것이다 — 한자리에 오래 서 있으면 그만큼 찍힌다.
      #   믿을 수 있는 것은 1.5m 안쪽이고, 진입 문턱(100mm)은
      #   1.5m 에서 이미 다 채워진다.
      # ⚠ 2026-11-13 1.5 -> 1.40: 카메라가 넥 위로 올라간 뒤 정면 카메라 확인이
      #   렉 중심 1.40m 에서 통과(앞 기둥 61~100%). 더 가까우면 기둥이 화면 밖.
      standoff: 1.40
      note: "실측 2026-09-21, 값 정정 2026-09-21. 크롬 기둥"
