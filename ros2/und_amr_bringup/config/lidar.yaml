# LDS-50C-E-12  (bluesea2 드라이버)
# 기본 제공 udp_lidar.yaml 에서 frame_id 만 우리 URDF 에 맞게 고친 것.
bluesea_node:
  ros__parameters:
    # 2026-10-26: 이 라이다(enp2s0)는 앞 왼쪽 (앞뒤 뒤집은 뒤). 합친 스캔은 scan_merger 가 /scan.
    frame_id: "laser_front"
    scan_topic: "scan_front"
    cloud_topic: "cloud"
    dev_id: -1
    raw_bytes: 3
    output_360: true
    output_scan: true
    output_cloud2: false
    with_angle_filter: false
    min_angle: -3.1415926
