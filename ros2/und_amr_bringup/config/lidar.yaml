    hard_resample: false
    soft_resample: false
    with_checksum: true
    reversed: false
    min_dist: 0.05
    max_dist: 40.0
    error_circle: 3
    error_scale: 0.9
    log_enable: false
    log_path: "/tmp/ros2_log.txt"
    type: "udp"
    lidar_ip: "192.168.158.98"
    lidar_port: 6543
    local_port: 6668
    group_ip: "224.1.2.3"
    uuid: -1
    resample_res: -1.0
    with_confidence: -1
    with_smooth: -1
    with_deshadow: -1
    alarm_msg: -1
    rpm: -1
    direction: -1
    ats: -1
    ntp_ip: "192.168.158.50"
    ntp_port: 5678
    ntp_enable: -1
